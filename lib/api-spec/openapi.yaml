openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ApplyAI application assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: profile
  - name: resume
  - name: jobs
  - name: applications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /resume/parse:
    post:
      operationId: parseResume
      tags: [resume]
      summary: Upload and parse a PDF resume
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ResumeUpload"
      responses:
        "200":
          description: Parsed resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeProfile"
  /resume/profile:
    patch:
      operationId: saveResumeProfile
      tags: [resume]
      summary: Save corrected parsed resume data
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeProfile"
      responses:
        "200":
          description: Saved resume profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeProfile"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List analyzed jobs
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Analyze and save a job description
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Analyzed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get an analyzed job
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update an analyzed job
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete an analyzed job
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /jobs/{id}/generate:
    post:
      operationId: generateApplication
      tags: [applications]
      summary: Generate an application package for a job
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Generated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List application packages
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application package
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application content or status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application package
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
      required: [id, email, name]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]
    RegisterInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }
      required: [email, password, name]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
      required: [email, password]
    Profile:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        education:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        experience:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { type: string }
        github: { type: string }
        linkedin: { type: string }
        portfolio: { type: string }
        preferredRoles:
          type: array
          items: { type: string }
        resumeProfile:
          oneOf:
            - $ref: "#/components/schemas/ResumeProfile"
            - type: "null"
      required:
        - id
        - email
        - name
        - education
        - skills
        - experience
        - projects
        - github
        - linkedin
        - portfolio
        - preferredRoles
        - resumeProfile
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        education:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { type: string }
        experience:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { type: string }
        github: { type: string }
        linkedin: { type: string }
        portfolio: { type: string }
        preferredRoles:
          type: array
          items: { type: string }
    ResumeUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]
    ResumeProfile:
      type: object
      properties:
        name: { type: string }
        skills:
          type: array
          items: { type: string }
        education:
          type: array
          items: { type: string }
        experience:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { type: string }
      required: [name, skills, education, experience, projects]
    JobInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        company: { type: string }
        description: { type: string, minLength: 40 }
      required: [title, description]
    JobUpdate:
      type: object
      properties:
        title: { type: string }
        company: { type: string }
        description: { type: string }
    Job:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        company: { type: string }
        description: { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        niceToHaveSkills:
          type: array
          items: { type: string }
        responsibilities:
          type: array
          items: { type: string }
        matchScore: { type: integer, minimum: 0, maximum: 100 }
        matchedSkills:
          type: array
          items: { type: string }
        missingSkills:
          type: array
          items: { type: string }
        mostRelevantProject: { type: string }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - title
        - company
        - description
        - requiredSkills
        - niceToHaveSkills
        - responsibilities
        - matchScore
        - matchedSkills
        - missingSkills
        - mostRelevantProject
        - createdAt
    Application:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        title: { type: string }
        company: { type: string }
        coverLetter: { type: string }
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationAnswer"
        status:
          type: string
          enum: [Saved, Analyzed, Prepared, Applied, Rejected, Offer]
        matchScore: { type: integer, minimum: 0, maximum: 100 }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - jobId
        - title
        - company
        - coverLetter
        - answers
        - status
        - matchScore
        - updatedAt
    ApplicationAnswer:
      type: object
      properties:
        question: { type: string }
        answer: { type: string }
      required: [question, answer]
    ApplicationUpdate:
      type: object
      properties:
        coverLetter: { type: string }
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationAnswer"
        status:
          type: string
          enum: [Saved, Analyzed, Prepared, Applied, Rejected, Offer]